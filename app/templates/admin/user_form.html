{% extends "base.html" %}
{% block title %}Créer un compte · MediCare Cabinet{% endblock %}
{% block content %}
<section class="page-heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Créer un compte</h1></div></section>
<form class="form-panel form-stack" method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><div><label class="form-label" for="name">Nom complet</label><input class="form-control" id="name" name="name" maxlength="120" required></div><div><label class="form-label" for="email">Adresse e-mail</label><input class="form-control" id="email" name="email" type="email" maxlength="254" required></div><div><label class="form-label" for="role">Rôle</label><select class="form-select" id="role" name="role" required><option value="">Choisir un rôle</option><option value="medecin">Médecin</option><option value="secretaire">Secrétariat</option><option value="admin">Administration</option></select></div><div><label class="form-label" for="password">Mot de passe initial</label><input class="form-control" id="password" name="password" type="password" minlength="8" autocomplete="new-password" required><div class="form-text">8 caractères minimum, dont au moins un chiffre.</div></div><div class="form-actions"><a class="btn btn-outline-secondary" href="{{ url_for('admin.users') }}">Annuler</a><button class="btn btn-primary" type="submit">Créer le compte</button></div></form>
{% endblock %}
