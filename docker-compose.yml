services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_SSLMODE: disable
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      SESSION_COOKIE_SECURE: "false"
      DEBUG: "false"
      RATELIMIT_STORAGE_URI: memory://
    command: sh -c "python seed.py && exec gunicorn --bind 0.0.0.0:8000 --workers 1 --access-logfile - --access-logformat '{\"level\":\"INFO\",\"status\":%(s)s,\"method\":\"%(m)s\"}' --error-logfile - --capture-output 'app:create_app()'"
    ports:
      - "${APP_PORT:-5000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:?Définir DB_NAME dans .env}
      POSTGRES_USER: ${DB_USER:?Définir DB_USER dans .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définir DB_PASSWORD dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: bitnamilegacy/minio:2025.4.22
    restart: unless-stopped
    command: server /bitnami/minio/data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Définir S3_ACCESS_KEY dans .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Définir S3_SECRET_KEY dans .env}
    volumes:
      - minio_data:/bitnami/minio/data
    ports:
      - "9000:9000"
      - "9001:9001"

volumes:
  postgres_data:
  minio_data: